name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  android:
    name: android cdylib (jniLibs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o jniLibs build --release --lib
      - name: Report size and exported JNI symbol
        run: |
          ls -l jniLibs/*/libneteasy_backend.so
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "::notice title=$abi::$(stat -c %s jniLibs/$abi/libneteasy_backend.so) bytes"
          done
          nm -D --defined-only jniLibs/arm64-v8a/libneteasy_backend.so | grep Java_ | tee /dev/stderr | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: jniLibs
