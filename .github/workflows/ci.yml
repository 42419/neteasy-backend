name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  android:
    name: android cdylib (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: cargo ndk -t arm64-v8a build --release --lib
      - name: Report size
        run: |
          ls -l target/aarch64-linux-android/release/libneteasy_backend.so
          echo "::notice title=libneteasy_backend.so::$(stat -c %s target/aarch64-linux-android/release/libneteasy_backend.so) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: libneteasy_backend-arm64-v8a
          path: target/aarch64-linux-android/release/libneteasy_backend.so
