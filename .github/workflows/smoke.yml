name: Live smoke test

# 手动触发：构建服务，等它完成引导（xeapi 公钥 + 游客 token），然后对真实的网易云服务器
# 调用 App 依赖的接口。结果压缩成少量 annotation 输出（GitHub 每个 step 最多显示 10 条 notice）。
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Run server and call endpoints
        run: |
          nohup ./target/release/neteasy-backend --port 19800 --data-dir "$RUNNER_TEMP/data" > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:19800/ >/dev/null && break; sleep 1; done
          sleep 12
          r() { curl -s -m 30 "http://127.0.0.1:19800$1"; }
          s() { printf '%s' "$1" | jq -c "$2" 2>/dev/null | head -c 260 || printf '%s' "$1" | head -c 200; }
          {
            echo "anonimous: $(r /register/anonimous | head -c 300)"
            echo "login_status: $(s "$(r /login/status)" '{code, acct: (.data.account.id // null), anon: (.data.account.anonimousUser // null)}')"
            echo "song_url(3 ids): $(s "$(r '/song/url/v1?id=347230,33894312,1969519579&level=standard')" '[.data[]|{id,code,br,hasUrl:(.url!=null)}]')"
            echo "song_url(exhigh): $(s "$(r '/song/url/v1?id=33894312&level=exhigh')" '[.data[]|{id,code,br,hasUrl:(.url!=null),level}]')"
            echo "detail: $(s "$(r '/song/detail?ids=347230,33894312')" '[.songs[]|.name]')"
            echo "search: $(s "$(r '/search?keywords=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=3')" '[.result.songs[]|.name]')"
            echo "lyric_new: $(s "$(r '/lyric/new?id=347230')" '{code, hasYrc:(.yrc.lyric!=null), hasLrc:(.lrc.lyric!=null)}')"
            echo "playlist_track_all: $(s "$(r '/playlist/track/all?id=3778678&limit=3')" '[.songs[]|.name]')"
            echo "recommend_songs(guest): $(r /recommend/songs | head -c 160)"
            echo "banner: $(s "$(r '/banner?type=1')" '{code, n:(.banners|length)}')"
            echo "personalized: $(s "$(r '/personalized?limit=2')" '{code, n:(.result|length)}')"
            echo "album: $(s "$(r '/album?id=34209')" '{code, name:.album.name}')"
            echo "comment_new: $(s "$(r '/comment/new?type=0&id=347230&pageSize=2')" '{code, total:.data.totalCount}')"
            echo "likelist(guest): $(r '/likelist?uid=1' | head -c 160)"
          } > results.txt
          cat results.txt
          # ---- 首页区块：每个区块的 blockCode、标题、第一个 creative 的结构
          r '/homepage/block/page' > blocks.json
          jq -c '.data.blocks[]? | {blockCode, showType, ui: (.uiElement // {} | tostring | .[0:260]), n: (.creatives|length), c0: ((.creatives[0] // {}) | {creativeType, action, actionType, ui: (.uiElement // {} | tostring | .[0:200]), nres: (.resources|length), r0keys: ((.resources[0] // {}) | keys), r0type: (.resources[0].resourceType // null), r0ui: (.resources[0].uiElement // {} | tostring | .[0:260])})}' blocks.json > blocks.txt 2>/dev/null || true
          echo "block-page: code=$(jq -r '.code' blocks.json 2>/dev/null) hasMore=$(jq -r '.data.hasMore' blocks.json 2>/dev/null) dataKeys=$(jq -c '.data|keys' blocks.json 2>/dev/null) blocks=$(wc -l < blocks.txt)" > blockhead.txt
          cat blockhead.txt blocks.txt
          r '/homepage/dragon/ball' > dragon.json
          echo "dragon: $(head -c 700 dragon.json)" > dragon.txt
          cat dragon.txt
          # ---- 新增接口：只看 code 和顶层字段
          k() { printf '%s' "$(r "$1")" | jq -c '{code, k: (keys | map(select(. != "code")))}' 2>/dev/null | head -c 180 || true; }
          {
            echo "dragon_ball: $(printf '%s' "$(r /homepage/dragon/ball)" | jq -c '[.data[]? | .name]' 2>/dev/null | head -c 300)"
            echo "program_recommend: $(k /program/recommend)"
            echo "personalized_newsong: $(k /personalized/newsong)"
            echo "personalized_djprogram: $(k /personalized/djprogram)"
            echo "top_playlist(说唱): $(k '/top/playlist?cat=%E8%AF%B4%E5%94%B1&limit=3')"
            echo "playlist_catlist: $(k /playlist/catlist)"
            echo "playlist_hot: $(k /playlist/hot)"
            echo "top_playlist_highquality: $(k '/top/playlist/highquality?limit=3')"
            echo "style_list: $(k /style/list)"
            echo "dj_recommend: $(k /dj/recommend)"
            echo "dj_program_toplist: $(k '/dj/program/toplist?limit=3')"
            echo "top_artists: $(k '/top/artists?limit=3')"
            echo "toplist_artist: $(k /toplist/artist)"
            echo "style_preference(guest): $(k /style/preference)"
          } > newapis.txt
          cat newapis.txt
          n=0
          while IFS= read -r line; do
            n=$((n+1))
            echo "::notice title=block$n::$(printf '%s' "$line" | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 1500)"
          done < <(cat blockhead.txt blocks.txt)
          echo "::notice title=dragon::$(tr -c '[:print:]' ' ' < dragon.txt | tr '%' ' ' | head -c 900)"
          echo "::notice title=new-apis::$(tr '\n\r%' '|  ' < newapis.txt | head -c 3800)"
      # 单独一个 step：GitHub 每个 step 最多显示 10 条 notice，上一个 step 已经用满了
      # 游客下需要登录的接口会返回 301，这也能证明路由和加密没问题
      - name: 「我的」页接口
        run: |
          r() { curl -s -m 30 "http://127.0.0.1:19800$1"; }
          PUB_UID=32953014
          routes=(
            /user/account "/user/detail/new?uid=$PUB_UID" /user/level /user/subcount "/user/medal?uid=$PUB_UID"
            "/user/follows?uid=$PUB_UID&limit=2" "/user/followeds?uid=$PUB_UID&limit=2" "/user/binding?uid=$PUB_UID"
            "/user/social/status?uid=$PUB_UID" /user/social/status/rcmd "/user/record?uid=$PUB_UID" "/user/playlist/collect?uid=$PUB_UID"
            "/playmode/intelligence/list?id=347230&pid=3778678"
            /record/recent/song /record/recent/playlist /record/recent/album /record/recent/video /record/recent/voice /record/recent/dj
            /recent/listen/list /user/cloud "/user/cloud/detail?id=1" /yunbei /yunbei/info /yunbei/today /yunbei/tasks
            /yunbei/tasks/todo /yunbei/task/list/v1
            "/user/dj?uid=$PUB_UID" /dj/sublist /album/sublist /artist/sublist /mv/sublist /digitalAlbum/purchased /mlog/mycollect
            /vip/info /vip/info/v2 /vip/growthpoint /vip/growthpoint/details /vip/tasks "/vip/tasks/v1?id=1" /vip/timemachine
            /vip/sign/info "/vip/sign/detail?timestamp=$(date +%s000)" /vip/sign/history /signin/progress
            /listen/data/total /listen/data/today/song /listen/data/year/report /listen/data/report /listen/data/realtime/report /listen/data/song/play/rank
            "/user/mutualfollow/get?uid=$PUB_UID" "/user/comment/history?uid=$PUB_UID" /topic/sublist /playlist/mylike /song/purchased
            /broadcast/category/region/get /broadcast/channel/list /broadcast/channel/collect/list "/broadcast/channel/currentinfo?id=1" /voicelist/my/created
          )
          : > profile.txt
          for rt in "${routes[@]}"; do
            out=$(printf '%s' "$(r "$rt")" | jq -c '{code, msg: (.msg // .message // null), k: (keys | map(select(. != "code" and . != "msg" and . != "message")) | .[0:5])}' 2>/dev/null | head -c 200)
            [ -z "$out" ] && out="(非 JSON / 无响应)"
            echo "${rt%%\?*} -> $out" >> profile.txt
          done
          cat profile.txt
          split -l 14 profile.txt prof_
          n=0
          for f in prof_*; do
            n=$((n+1))
            echo "::notice title=profile$n::$(tr '\n\r%' '|  ' < "$f" | head -c 3800)"
          done
          echo "::notice title=results-1::$(sed -n 1,5p results.txt | tr '\n\r%' '|  ' | head -c 3500)"
          echo "::notice title=results-2::$(sed -n 6,14p results.txt | tr '\n\r%' '|  ' | head -c 3500)"
          echo "::notice title=server-log::$(tail -n 14 server.log | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 3500)"
      # 搜索和听歌打点：真实服务器上的返回结构。scrobble 用的是游客账号，只写一条游客的听歌记录
      - name: 搜索与打点
        run: |
          r() { curl -s -m 30 "http://127.0.0.1:19800$1"; }
          KW=%E6%B5%B7%E9%98%94%E5%A4%A9%E7%A9%BA
          {
            echo "cloudsearch(单曲): $(r "/cloudsearch?keywords=$KW&limit=2" | jq -c '{code, rk: (.result | keys), n: (.result.songs | length), first: (.result.songs[0] | {id, name, keys: (keys | .[0:14])})}' 2>/dev/null | head -c 700)"
            echo "cloudsearch(歌单 1000): $(r "/cloudsearch?keywords=$KW&type=1000&limit=2" | jq -c '{code, rk: (.result | keys), first: (.result.playlists[0] | {id, name})}' 2>/dev/null | head -c 400)"
            echo "cloudsearch(歌手 100): $(r "/cloudsearch?keywords=%E5%91%A8%E6%9D%B0%E4%BC%A6&type=100&limit=1" | jq -c '{code, rk: (.result | keys), first: (.result.artists[0] | {id, name})}' 2>/dev/null | head -c 300)"
            echo "search_default: $(r /search/default | jq -c '{code, data: (.data | keys), kw: .data.showKeyword}' 2>/dev/null | head -c 300)"
            echo "search_hot_detail: $(r /search/hot/detail | jq -c '{code, n: (.data | length), first: (.data[0] | keys)}' 2>/dev/null | head -c 300)"
            echo "search_multimatch: $(r "/search/multimatch?keywords=$KW" | jq -c '{code, rk: (.result | keys), orders: .result.orders}' 2>/dev/null | head -c 300)"
            echo "scrobble: $(r '/scrobble?id=347230&sourceid=3778678&time=30' | head -c 500)"
          } > search.txt
          cat search.txt
          echo "::notice title=search-scrobble::$(tr -c '[:print:]' ' ' < search.txt | tr '%' ' ' | head -c 3800)"
      # 「关注」页：动态流、关注关系、话题。游客下需要登录的接口返回 301；follow / resource/like 是写操作，这里不调用
      - name: 关注页接口
        run: |
          r() { curl -s -m 30 "http://127.0.0.1:19800$1"; }
          PUB_UID=32953014
          {
            echo "event(关注动态流): $(r /event | jq -c '{code, msg: (.msg // .message), k: (keys | map(select(. != "code")) | .[0:6])}' 2>/dev/null | head -c 300)"
            echo "user_event(公开用户): $(r "/user/event?uid=$PUB_UID&limit=2" | jq -c '{code, more, lasttime, n: (.events | length), ev0: (.events[0] // {} | keys | .[0:14])}' 2>/dev/null | head -c 500)"
            echo "user_follow_mixed: $(r '/user/follow/mixed?size=2' | jq -c '{code, msg: (.msg // .message), k: (keys | map(select(. != "code")) | .[0:6])}' 2>/dev/null | head -c 300)"
            echo "user_follows(公开用户): $(r "/user/follows?uid=$PUB_UID&limit=2" | jq -c '{code, more, n: (.follow | length), f0: (.follow[0] // {} | keys | .[0:8])}' 2>/dev/null | head -c 400)"
            echo "hot_topic: $(r '/hot/topic?limit=2' | jq -c '{code, k: (keys | map(select(. != "code")) | .[0:6]), n: ((.hot // []) | length), t0: ((.hot // [])[0] // {} | keys | .[0:10])}' 2>/dev/null | head -c 500)"
            echo "event_search: $(r '/event/search?keywords=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=2' | jq -c '{code, k: (keys | map(select(. != "code")) | .[0:6])}' 2>/dev/null | head -c 300)"
            echo "comment_event(无效id): $(r '/comment/event?threadId=A_EV_2_1' | head -c 160)"
          } > follow.txt
          cat follow.txt
          echo "::notice title=follow-page::$(tr -c '[:print:]' ' ' < follow.txt | tr '%' ' ' | head -c 3800)"
      # 动态条目的关键字段：json 字段是不是字符串、里面有什么
      - name: 动态条目结构
        run: |
          r() { curl -s -m 30 "http://127.0.0.1:19800$1"; }
          r "/user/event?uid=32953014&limit=3" > ev.json
          {
            echo "top: $(jq -c '{code, more, lasttime, size, keys: (keys | .[0:12])}' ev.json 2>/dev/null | head -c 300)"
            echo "item: $(jq -c '.events[0] | {id, type, eventTime, uuid, user: (.user | {userId, nickname}), jsonType: (.json | type), info: (.info | keys), pics: (.pics | length), topEvent: .topEvent, forwardCount, expireTime}' ev.json 2>/dev/null | head -c 600)"
            echo "json: $(jq -c '.events[0].json | fromjson | keys' ev.json 2>/dev/null | head -c 500)"
            echo "json.msg: $(jq -r '.events[0].json | fromjson | .msg' ev.json 2>/dev/null | head -c 80)"
            echo "json.song: $(jq -c '.events[0].json | fromjson | (.song // {}) | {id, name, keys: (keys | .[0:10])}' ev.json 2>/dev/null | head -c 300)"
            echo "types: $(jq -c '[.events[] | .type]' ev.json 2>/dev/null | head -c 200)"
            echo "info: $(jq -c '.events[0].info | {commentThread: (.commentThread | {id, commentCount, likedCount}), liked, likedCount, commentCount, shareCount}' ev.json 2>/dev/null | head -c 400)"
          } > evitem.txt
          cat evitem.txt
          echo "::notice title=event-item::$(tr -c '[:print:]' ' ' < evitem.txt | tr '%' ' ' | head -c 3800)"
