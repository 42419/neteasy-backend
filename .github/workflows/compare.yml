name: Compare with upstream (live)

# 手动触发的 A/B 对照：在同一台 runner 上同时启动 api-enhanced（Node）和本项目的服务，
# 对两者调用相同的接口，用来区分「环境影响（地区/IP）」和「移植 bug」。
on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Install upstream
        run: |
          git clone --depth 1 https://github.com/NeteaseCloudMusicApiEnhanced/api-enhanced.git "$RUNNER_TEMP/up"
          cd "$RUNNER_TEMP/up"
          npm install --no-audit --no-fund --omit=dev --ignore-scripts > "$RUNNER_TEMP/npm.log" 2>&1 || true
          echo "::notice title=npm::exit-ok node_modules=$(ls node_modules 2>/dev/null | wc -l) $(tail -n 3 "$RUNNER_TEMP/npm.log" | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 400)"
      - name: Start upstream
        run: |
          cd "$RUNNER_TEMP/up"
          PORT=3000 nohup node app.js > "$RUNNER_TEMP/up.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3000/ >/dev/null && break; sleep 1; done
          echo "::notice title=up-start::$(tail -n 6 "$RUNNER_TEMP/up.log" | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 900)"
      - name: Start this server
        run: |
          nohup "$GITHUB_WORKSPACE/target/release/neteasy-backend" --port 19800 --data-dir "$RUNNER_TEMP/data" > "$RUNNER_TEMP/me.log" 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:19800/ >/dev/null && break; sleep 1; done
          sleep 15
      - name: Call the same endpoints on both
        run: |
          cmp() {
            name=$1; path=$2; filter=$3
            for who in UP:3000 ME:19800; do
              label=${who%%:*}; port=${who##*:}
              t0=$(date +%s)
              raw=$(curl -s -m 40 "http://127.0.0.1:$port$path" || true)
              dt=$(( $(date +%s) - t0 ))
              if [ -z "$raw" ]; then out="EMPTY/TIMEOUT after ${dt}s"; else
                out=$(printf '%s' "$raw" | jq -c "$filter" 2>/dev/null || true)
                [ -z "$out" ] && out="RAW: $(printf '%s' "$raw" | head -c 160)"
                out="$out (${dt}s)"
              fi
              echo "$name $label: $(printf '%s' "$out" | head -c 230)"
            done
          }
          {
            cmp anonimous "/register/anonimous" '{code, msg, hasCookie:(.cookie!=null and (.cookie|length)>0)}'
            cmp song_url "/song/url/v1?id=347230,33894312,1969519579&level=standard" '[.data[]|{id,code,br,hasUrl:(.url!=null)}]'
            cmp track_all "/playlist/track/all?id=3778678&limit=3" '{code, n:(.songs|length)}'
            cmp login_status "/login/status" '{code:.data.code, acct:(.data.account.id // null)}'
            cmp detail "/song/detail?ids=347230" '[.songs[]|.name]'
            # 「我的」页里游客下出现 302 / 404 的接口：看上游 Node 版是否一样，区分「游客限制」和「移植问题」
            cmp yunbei "/yunbei" '{code, msg}'
            cmp yunbei_today "/yunbei/today" '{code, msg}'
            cmp user_level "/user/level" '{code, msg}'
            cmp listen_total "/listen/data/total" '{code, msg}'
            cmp listen_report "/listen/data/report" '{code, msg}'
            cmp listen_year "/listen/data/year/report" '{code, msg}'
            cmp mlog "/mlog/mycollect" '{code, msg}'
            cmp social_rcmd "/user/social/status/rcmd" '{code, msg}'
            cmp user_account "/user/account" '{code, k:(keys)}'
            cmp vip_info "/vip/info" '{code, msg}'
            # 搜索和听歌打点：和上游在同一台机器上对比
            cmp cloudsearch "/cloudsearch?keywords=%E6%B5%B7%E9%98%94%E5%A4%A9%E7%A9%BA&limit=2" '{code, n:(.result.songs|length), first:(.result.songs[0].name)}'
            cmp search_default "/search/default" '{code, kw:.data.showKeyword}'
            cmp search_hot_detail "/search/hot/detail" '{code, n:(.data|length)}'
            cmp search_multimatch "/search/multimatch?keywords=%E5%91%A8%E6%9D%B0%E4%BC%A6" '{code, rk:(.result|keys)}'
            cmp scrobble "/scrobble?id=347230&sourceid=3778678&time=30" '{code, data, details: (.details|keys)}'
            # 「关注」页：动态流、公开用户的动态、话题
            cmp event "/event" '{code, msg}'
            cmp user_event "/user/event?uid=32953014&limit=2" '{code, more, n:(.events|length)}'
            cmp user_follow_mixed "/user/follow/mixed?size=2" '{code, msg}'
            cmp hot_topic "/hot/topic?limit=2" '{code, n:((.hot // [])|length)}'
            cmp event_search "/event/search?keywords=%E5%91%A8%E6%9D%B0%E4%BC%A6&limit=2" '{code, k:(keys)}'
          } > cmp.txt
          cat cmp.txt
          echo "::notice title=compare::$(tr '\n\r%' '|  ' < cmp.txt | head -c 4000)"
          echo "::notice title=up.log::$(tail -n 8 "$RUNNER_TEMP/up.log" | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 1500)"
          echo "::notice title=me.log::$(tail -n 8 "$RUNNER_TEMP/me.log" | tr -c '[:print:]' ' ' | tr '%' ' ' | head -c 1500)"
