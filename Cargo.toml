[package]
name = "neteasy-backend"
version = "0.1.0"
edition = "2021"
description = "Embedded NetEase Cloud Music API backend for neteasy (Rust rewrite of the endpoints actually used)"
license = "MIT"

[lib]
name = "neteasy_backend"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "neteasy-backend"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
aes-gcm = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_urlencoded = "0.7"
thiserror = "1"
indexmap = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "http2"] }
qrcode = { version = "0.14", default-features = false }
png = "0.17"
log = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"
